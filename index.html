      left: 20%;

      z-index: 0;
    }
    .festive-glow-2 {

      filter: blur(70px);
      pointer-events: none;
      z-index: 0;
    }

    /* Snowfall Canvas */
    .snow-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    
    /* Smooth fluid scrolling & clean scrollbars */
    html { scroll-behavior: smooth; }
    #mainCanvas, #scriptDrawer {
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: rgba(16, 185, 129, 0.3) rgba(15, 23, 42, 0.4);
    }
    #mainCanvas::-webkit-scrollbar, #scriptDrawer::-webkit-scrollbar {
      width: 6px;
    }
    #mainCanvas::-webkit-scrollbar-track, #scriptDrawer::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.4);
    }
    #mainCanvas::-webkit-scrollbar-thumb, #scriptDrawer::-webkit-scrollbar-thumb {
      background-color: rgba(16, 185, 129, 0.3);
      border-radius: 9999px;
    }

    /* Keyframe Animations */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    .animate-float {
      animation: floatSlow 4s ease-in-out infinite;
    }

    @keyframes steamDrift {
      0% { transform: translateY(0) scaleX(1); opacity: 0.8; }
      50% { transform: translateY(-8px) scaleX(1.2); opacity: 0.4; }
      100% { transform: translateY(-16px) scaleX(1.4); opacity: 0; }
    }
    .steam-line {
      animation: steamDrift 1.8s linear infinite;
    }

    @keyframes rainShower {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 0.9; }
      100% { transform: translateY(16px); opacity: 0; }
    }
    .water-drop-1 { animation: rainShower 1.1s ease-in infinite; }
    .water-drop-2 { animation: rainShower 1.1s ease-in infinite 0.35s; }
    .water-drop-3 { animation: rainShower 1.1s ease-in infinite 0.7s; }

    @keyframes batteryWarn {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.96); }
    }
    .animate-battery {
      animation: batteryWarn 1.2s ease-in-out infinite;
    }

    /* Glowing Accents */
    .glow-teal { box-shadow: 0 0 35px rgba(45, 122, 115, 0.35); }
    .glow-rose { box-shadow: 0 0 35px rgba(225, 29, 72, 0.35); }
    .glow-gold { box-shadow: 0 0 30px rgba(245, 158, 11, 0.3); }

      color: #ffffff !important;
      border-color: #34D399 !important;

    .iphone-frame {

    }

    .no-scrollbar::-webkit-scrollbar { display: none !important; }
    .no-scrollbar { -ms-overflow-style: none !important; scrollbar-width: none !important; }

    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

</head>

      const ctx = canvas.getContext('2d');

          y: Math.random() * height,
          radius: Math.random() * 2.2 + 0.8,
          density: Math.random() * 2,
          speed: Math.random() * 0.6 + 0.3,
          swaySpeed: Math.random() * 0.02 + 0.008,
          swayOffset: Math.random() * Math.PI * 2,
          opacity: Math.random() * 0.45 + 0.2
        });
      }

      let frame = 0;
      function draw() {
        if (!snowEnabled) return;
        ctx.clearRect(0, 0, width, height);
        frame++;
        
        for (let i = 0; i < snowflakes.length; i++) {
          const f = snowflakes[i];
          ctx.beginPath();
          ctx.fillStyle = `rgba(255, 255, 255, ${f.opacity})`;
          ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2, true);
          ctx.fill();
        }
        update();
        snowAnimId = requestAnimationFrame(draw);
      }

      function update() {
        for (let i = 0; i < snowflakes.length; i++) {
          const f = snowflakes[i];
          f.y += f.speed;
          f.x += Math.sin(frame * f.swaySpeed + f.swayOffset) * 0.6;

          if (f.y > height + 10) {
            f.y = -10;
            f.x = Math.random() * width;
          }
          if (f.x > width + 10) f.x = -10;
          if (f.x < -10) f.x = width + 10;
        }
      }

      draw();

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });
    }

    // Helper: Parse hash to 0-based stage index supporting both 1-based (#1-#7, #stage-1 to #stage-7) and semantic IDs
    function parseHashToStage(rawHash) {
      if (!rawHash) return 0;
      const clean = rawHash.replace('#', '').toLowerCase().trim();
      const idMap = {
        'dilemma': 0, 'insight': 0, 'idea': 0, 'holiday': 0, 'stage1': 0, 'stage-1': 0, 'slide1': 0, 'slide-1': 0,
        'objectives': 1, 'commercial': 1, 'levers': 1, 'stage2': 1, 'stage-2': 1, 'slide2': 1, 'slide-2': 1,
        'filterlab': 2, 'audience': 2, 'cohorts': 2, 'stage3': 2, 'stage-3': 2, 'slide3': 2, 'slide-3': 2,
        'phonesim': 3, 'channels': 3, 'journey': 3, 'waves': 3, 'stage4': 3, 'stage-4': 3, 'slide4': 3, 'slide-4': 3,
        'abtest': 4, 'testing': 4, 'experiments': 4, 'stage5': 4, 'stage-5': 4, 'slide5': 4, 'slide-5': 4,
        'measurement': 5, 'incrementality': 5, 'scorecard': 5, 'stage6': 5, 'stage-6': 5, 'slide6': 5, 'slide-6': 5,
        'collaboration': 6, 'moat': 6, 'teams': 6, 'cross-functional': 6, 'stage7': 6, 'stage-7': 6, 'slide7': 6, 'slide-7': 6
      };
      if (idMap[clean] !== undefined) return idMap[clean];

      const stageMatch = clean.match(/^(?:stage|slide)?-?0?([1-7])$/);
      if (stageMatch) return parseInt(stageMatch[1]) - 1;

      const num = parseInt(clean);
      if (!isNaN(num)) {
        if (num >= 1 && num <= stages.length) return num - 1; // #1 -> 0, #2 -> 1, ..., #7 -> 6
        if (num === 0) return 0;
      }
      return 0;
    }

    // Initialize with Robust 1-Based Hash Support
    let startIdx = 0;
    const hashStr = window.location.hash || '';
    const isLime = hashStr.indexOf('limehome') !== -1;
    const isPush = hashStr.indexOf('push') !== -1;
    const isIam = hashStr.indexOf('iam') !== -1;
    const isWa = hashStr.indexOf('wa') !== -1;

    let subV = null;
    if (isPush) subV = 'push';
    else if (isIam) subV = 'iam';
    else if (isWa) subV = 'whatsapp';
    else if (isLime) subV = 'limehome';

    if (hashStr) {
      startIdx = parseHashToStage(hashStr);
    }
    switchTab(startIdx, subV);
    initSnow();

    window.addEventListener('hashchange', () => {
      const targetIdx = parseHashToStage(window.location.hash);
      if (targetIdx !== currentStage) {
        switchTab(targetIdx);
      }
    });
  </script>
</body>
